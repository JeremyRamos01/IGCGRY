<!doctype html>
<html lang="es">

<head>
    <title>Noticias y Posts | Iglesia Evangélica en Leganés</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="Noticias, eventos recientes y posts de la Iglesia Evangélica en Leganés, Casa del Gran REY.">
    <!-- Bootstrap CSS v5.3.2 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <!-- AOS Animation CSS -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link href="css/style.css" rel="stylesheet">
</head>

<body>
    <!-- BARRA DE NAVEGACIÓN CENTRALIZADA -->
    <script src="js/navbar.js"></script>

    <!-- PAGE HEADER -->
    <header class="page-header" data-aos="fade-in" data-aos-duration="1500" style="padding-top: 150px; padding-bottom: 80px; background: linear-gradient(135deg, var(--primary-dark) 0%, #1e293b 100%);">
        <div class="container text-center text-white">
            <h1 class="mb-3 fw-bold display-4">Noticias y Posts</h1>
            <p class="lead text-white-50">Mantente al tanto de todo lo que ocurre en nuestra congregación</p>
        </div>
    </header>

    <main>
        <section class="section-padding bg-light">
            <div class="container">
                <div class="row g-4" id="posts-container">
                    <div class="col-12 text-center py-5">
                        <div class="spinner-border text-gold" role="status">
                            <span class="visually-hidden">Cargando...</span>
                        </div>
                        <p class="mt-3 text-muted">Cargando publicaciones...</p>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- FOOTER CENTRALIZADO -->
    <script src="js/footer.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({ once: true, offset: 50 });
    </script>

    <script type="module">
        import { db } from './js/firebase-config.js';
        import { collection, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const container = document.getElementById('posts-container');
        const postsRef = collection(db, 'posts');
        const q = query(postsRef, orderBy('fecha', 'desc'));

        onSnapshot(q, (snapshot) => {
            container.innerHTML = '';
            
            if (snapshot.empty) {
                container.innerHTML = '<div class="col-12 text-center py-5"><h4 class="text-muted">Aún no hay publicaciones.</h4></div>';
                return;
            }

            snapshot.forEach((doc) => {
                const post = doc.data();
                const date = post.fecha ? new Date(post.fecha).toLocaleDateString('es-ES', { 
                    year: 'numeric', month: 'long', day: 'numeric' 
                }) : '';

                let mediaHtml = '';
                const images = post.imageUrls || (post.imageUrl ? [post.imageUrl] : []);
                
                if (images.length === 1) {
                    mediaHtml = `<img src="${images[0]}" class="card-img-top" alt="Imagen del post" style="height: 250px; object-fit: cover;">`;
                } else if (images.length > 1) {
                    const carouselId = 'carousel-' + doc.id;
                    let indicators = '';
                    let inner = '';
                    images.forEach((url, i) => {
                        indicators += `<button type="button" data-bs-target="#${carouselId}" data-bs-slide-to="${i}" class="${i===0?'active':''}"></button>`;
                        inner += `
                            <div class="carousel-item ${i===0?'active':''}">
                                <img src="${url}" class="d-block w-100" style="height: 250px; object-fit: cover;" alt="Imagen del post">
                            </div>
                        `;
                    });
                    mediaHtml = `
                        <div id="${carouselId}" class="carousel slide" data-bs-ride="carousel">
                            <div class="carousel-indicators">${indicators}</div>
                            <div class="carousel-inner">${inner}</div>
                            <button class="carousel-control-prev" type="button" data-bs-target="#${carouselId}" data-bs-slide="prev">
                                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                                <span class="visually-hidden">Anterior</span>
                            </button>
                            <button class="carousel-control-next" type="button" data-bs-target="#${carouselId}" data-bs-slide="next">
                                <span class="carousel-control-next-icon" aria-hidden="true"></span>
                                <span class="visually-hidden">Siguiente</span>
                            </button>
                        </div>
                    `;
                }

                const html = `
                    <div class="col-md-6 col-lg-4" data-aos="fade-up">
                        <div class="card h-100 border-0 shadow-sm rounded-4 overflow-hidden" style="transition: transform 0.3s;" onmouseover="this.style.transform='translateY(-5px)'" onmouseout="this.style.transform='translateY(0)'">
                            ${mediaHtml}
                            <div class="card-body p-4 d-flex flex-column">
                                <small class="text-muted mb-2 d-block"><i class="fa-regular fa-clock me-1 text-gold"></i> ${date}</small>
                                <h4 class="card-title fw-bold mb-3" style="color: var(--primary-dark);">${post.title}</h4>
                                <p class="card-text text-muted" style="white-space: pre-wrap; flex-grow: 1;">${post.content}</p>
                            </div>
                        </div>
                    </div>
                `;
                container.innerHTML += html;
            });
        }, (error) => {
            console.error("Error cargando posts:", error);
            container.innerHTML = '<div class="col-12 text-center py-5 text-danger">Error al cargar los posts.</div>';
        });
    </script>
</body>
</html>
