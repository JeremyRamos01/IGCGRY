<!doctype html>
<html lang="es">

<head>
    <title>Noticias y Posts | Iglesia Evangélica en Leganés</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="Noticias, eventos recientes y posts de la Iglesia Evangélica en Leganés, Casa del Gran REY.">
    <!-- Bootstrap CSS v5.3.2 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <!-- AOS Animation CSS -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link href="css/style.css" rel="stylesheet">
</head>

<body>
    <!-- BARRA DE NAVEGACIÓN CENTRALIZADA -->
    <script src="js/navbar.js"></script>

    <!-- PAGE HEADER -->
    <header class="page-header" data-aos="fade-in" data-aos-duration="1500" style="padding-top: 150px; padding-bottom: 80px; background: linear-gradient(135deg, var(--primary-dark) 0%, #1e293b 100%);">
        <div class="container text-center text-white">
            <h1 class="mb-3 fw-bold display-4">Noticias y Posts</h1>
            <p class="lead text-white-50">Mantente al tanto de todo lo que ocurre en nuestra congregación</p>
        </div>
    </header>

    <main>
        <section class="section-padding bg-light">
            <div class="container">
                <div class="row g-4" id="posts-container">
                    <div class="col-12 text-center py-5">
                        <div class="spinner-border text-gold" role="status">
                            <span class="visually-hidden">Cargando...</span>
                        </div>
                        <p class="mt-3 text-muted">Cargando publicaciones...</p>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Modal Lightbox para Ver Imagen en Grande -->
    <div class="modal fade" id="imageLightboxModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-xl modal-dialog-centered">
            <div class="modal-content bg-transparent border-0">
                <div class="modal-header border-0 pb-0 justify-content-end">
                    <button type="button" class="btn-close btn-close-white fs-3 shadow-lg" data-bs-dismiss="modal" aria-label="Close" style="filter: drop-shadow(0px 0px 5px rgba(0,0,0,0.8));"></button>
                </div>
                <div class="modal-body text-center p-2">
                    <img id="lightboxImage" src="" class="img-fluid rounded-4 shadow-lg" style="max-height: 85vh; object-fit: contain; width: auto;">
                </div>
            </div>
        </div>
    </div>

    <!-- FOOTER CENTRALIZADO -->
    <script src="js/footer.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({ once: true, offset: 50 });
    </script>

    <script type="module">
        import { db } from './js/firebase-config.js';
        import { collection, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const container = document.getElementById('posts-container');
        const postsRef = collection(db, 'posts');
        const q = query(postsRef, orderBy('fecha', 'desc'));

        window.openImageModal = function(url) {
            const modalImg = document.getElementById('lightboxImage');
            if (modalImg) {
                modalImg.src = url;
                const modal = new bootstrap.Modal(document.getElementById('imageLightboxModal'));
                modal.show();
            }
        };

        onSnapshot(q, (snapshot) => {
            container.innerHTML = '';
            
            if (snapshot.empty) {
                container.innerHTML = '<div class="col-12 text-center py-5"><h4 class="text-muted">Aún no hay publicaciones.</h4></div>';
                return;
            }

            snapshot.forEach((doc) => {
                const post = doc.data();
                const date = post.fecha ? new Date(post.fecha).toLocaleDateString('es-ES', { 
                    year: 'numeric', month: 'long', day: 'numeric' 
                }) : '';

                let mediaHtml = '';
                const images = post.imageUrls || (post.imageUrl ? [post.imageUrl] : []);
                
                if (images.length === 1) {
                    mediaHtml = `
                        <div class="position-relative overflow-hidden rounded-4 mt-3 shadow-sm" style="height: 480px; background-color: #0f172a; cursor: pointer;" onclick="openImageModal('${images[0]}')">
                            <img src="${images[0]}" class="w-100 h-100 post-img-zoom" style="object-fit: cover; transition: transform 0.4s ease;" alt="Imagen del post">
                            <div class="position-absolute bottom-0 end-0 m-3" style="z-index: 5; pointer-events: none;">
                                <span class="badge bg-dark bg-opacity-75 text-white px-3 py-2 rounded-pill shadow-sm" style="backdrop-filter: blur(4px);">
                                    <i class="fa-solid fa-expand me-1"></i> Ver en grande
                                </span>
                            </div>
                        </div>
                    `;
                } else if (images.length > 1) {
                    const carouselId = 'carousel-' + doc.id;
                    let indicators = '';
                    let inner = '';
                    images.forEach((url, i) => {
                        indicators += `<button type="button" data-bs-target="#${carouselId}" data-bs-slide-to="${i}" class="${i===0?'active':''}"></button>`;
                        inner += `
                            <div class="carousel-item ${i===0?'active':''} h-100 position-relative" style="cursor: pointer;" onclick="openImageModal('${url}')">
                                <img src="${url}" class="d-block w-100 h-100 post-img-zoom" style="object-fit: cover; transition: transform 0.4s ease;" alt="Imagen del post">
                                <div class="position-absolute bottom-0 end-0 m-3" style="z-index: 5; pointer-events: none;">
                                    <span class="badge bg-dark bg-opacity-75 text-white px-3 py-2 rounded-pill shadow-sm" style="backdrop-filter: blur(4px);">
                                        <i class="fa-solid fa-expand me-1"></i> Ver en grande (${i+1}/${images.length})
                                    </span>
                                </div>
                            </div>
                        `;
                    });
                    mediaHtml = `
                        <div id="${carouselId}" class="carousel slide rounded-4 overflow-hidden mt-3 shadow-sm" data-bs-ride="carousel" style="height: 480px; background-color: #0f172a;">
                            <div class="carousel-indicators">${indicators}</div>
                            <div class="carousel-inner h-100">${inner}</div>
                            <button class="carousel-control-prev" type="button" data-bs-target="#${carouselId}" data-bs-slide="prev">
                                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                                <span class="visually-hidden">Anterior</span>
                            </button>
                            <button class="carousel-control-next" type="button" data-bs-target="#${carouselId}" data-bs-slide="next">
                                <span class="carousel-control-next-icon" aria-hidden="true"></span>
                                <span class="visually-hidden">Siguiente</span>
                            </button>
                        </div>
                    `;
                }

                const html = `
                    <div class="col-lg-9 col-xl-8 mx-auto" data-aos="fade-up">
                        <div class="card border-0 shadow-sm rounded-4 p-4 p-md-4 bg-white mb-4">
                            <!-- TEXTO ARRIBA -->
                            <div class="d-flex align-items-center justify-content-between mb-3">
                                <span class="badge px-3 py-2 rounded-pill" style="background-color: var(--accent-gold); color: #000; font-weight: 600;">
                                    <i class="fa-solid fa-newspaper me-1"></i> Publicación
                                </span>
                                <small class="text-muted"><i class="fa-regular fa-clock me-1 text-gold"></i> ${date}</small>
                            </div>
                            <h3 class="card-title fw-bold mb-3" style="color: var(--primary-dark); font-size: 1.8rem;">${post.title}</h3>
                            <p class="card-text text-secondary mb-2" style="white-space: pre-wrap; font-size: 1.05rem; line-height: 1.7;">${post.content}</p>
                            
                            <!-- FOTOS DEBAJO EN UN CUADRADO GRANDE -->
                            ${mediaHtml}
                        </div>
                    </div>
                `;
                container.innerHTML += html;
            });
        }, (error) => {
            console.error("Error cargando posts:", error);
            container.innerHTML = '<div class="col-12 text-center py-5 text-danger">Error al cargar los posts.</div>';
        });
    </script>
    <style>
        .post-img-zoom:hover {
            transform: scale(1.02);
        }
    </style>
</body>
</html>
